[project]
name = "certified-bigquery-mcp"
version = "0.1.0"
description = "Certification-gated semantic layer ADK agent over Google BigQuery MCP with RBAC, AST literal binding, dry-run byte caps, and offline DuckDB fallback."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "duckdb>=1.1.0",
    "fastapi>=0.115.0,<1.0.0",
    "gcsfs>=2024.11.0",
    "google-adk[gcp,otel-gcp]>=2.6.0,<3.0.0",
    "google-auth>=2.29.0",
    "google-cloud-aiplatform[agent-engines]>=1.156.0,<2.0.0",
    "google-cloud-logging>=3.11.0,<4.0.0",
    "mcp>=1.2.0",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
    "pydantic>=2.6.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "sqlglot>=25.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.8",
    "requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Use public PyPI as the default index for this recipe.
[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = "."
# Integration tests require live credentials and are excluded from CI.
# Run them locally with: uv run pytest tests/integration
addopts = "--ignore=tests/integration"
