- category: multi-hop
  q: Revenue from customers who have a completed order
  role: finance
  expect: answer
  call:
    metric: revenue
    graph:
      start: Customer
      path:
      - HAS_ORDER
      filters:
        Order:
          status: completed
  gold_sql: SELECT SUM(amount) FROM payments WHERE status = 'success' AND customer_id
    IN (SELECT customer_id FROM orders WHERE status = 'completed')
