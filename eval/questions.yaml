- category: single
  q: What is our revenue?
  role: finance
  expect: answer
  call:
    metric: revenue
  gold_sql: SELECT SUM(amount) FROM payments WHERE status = 'success'
- category: single
  q: How many orders have we had?
  role: finance
  expect: answer
  call:
    metric: order_count
  gold_sql: SELECT COUNT(*) FROM orders
- category: single
  q: What is the average successful payment?
  role: finance
  expect: answer
  call:
    metric: avg_payment
  gold_sql: SELECT AVG(amount) FROM payments WHERE status = 'success'
- category: single
  q: How many customers ordered in the last 30 days?
  role: finance
  expect: answer
  call:
    metric: active_customers_30d
  gold_sql: SELECT COUNT(DISTINCT customer_id) FROM orders WHERE order_date >= current_date
    - 30
- category: single
  q: How many customers have a completed order?
  role: finance
  expect: answer
  call:
    metric: active_customers_completed
  gold_sql: SELECT COUNT(DISTINCT customer_id) FROM orders WHERE status = 'completed'
- category: single
  q: How many customers have a positive payment?
  role: finance
  expect: answer
  call:
    metric: active_customers_paid
  gold_sql: SELECT COUNT(DISTINCT customer_id) FROM payments WHERE amount > 0
- category: single
  q: How many customers do we have?
  role: finance
  expect: answer
  call:
    metric: customer_count
  gold_sql: SELECT COUNT(*) FROM customers
- category: single
  q: How many new customers in the last 30 days?
  role: finance
  expect: answer
  call:
    metric: new_customers
  gold_sql: SELECT COUNT(*) FROM customers WHERE created_at >= current_date - 30
- category: grouped
  q: Revenue by payment method
  role: finance
  expect: answer
  call:
    metric: revenue
    dims:
    - method
  gold_sql: SELECT method, SUM(amount) FROM payments WHERE status = 'success' GROUP
    BY method
