name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SEMLAYER_LLM_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - run: uv run ruff check src tests eval examples
      - run: uv run pytest -q
      - run: uv run semlayer demo && uv run semlayer eval --oracle
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }