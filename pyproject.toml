[project]
name = "arth-semlayer"
version = "0.1.0"
description = "Certification-gated semantic layer MCP server for BigQuery and DuckDB with default-deny RBAC."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Rituraj Singh" }]
keywords = ["mcp", "semantic-layer", "bigquery", "duckdb", "gemini", "rbac", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6",
  "sqlglot>=25",
  "duckdb>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  "mcp>=1.2",
]

[project.optional-dependencies]
gcp = ["google-auth>=2.29"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
semlayer = "semlayer.cli:main"

[project.urls]
Homepage = "https://github.com/RiturajSingh2004/arth-semlayer"
Repository = "https://github.com/RiturajSingh2004/arth-semlayer"
Issues = "https://github.com/RiturajSingh2004/arth-semlayer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semlayer"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E731"]
